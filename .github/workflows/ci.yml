name: Unit Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: fluxion-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: the checks below start together with no interdependency, and only once they all pass does the
  ## much heavier compiler matrix start.
  ##################################################################################################
  precommit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install pre-commit
        # Pinned, and binary-only so no dependency gets to run a setup script during install
        run: pip install --only-binary ":all:" pre-commit==4.6.2
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure --color=always


  ##################################################################################################
  ## Sanitizers (ASan+UBSan)
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
    with:
      project: fluxion

  ##################################################################################################
  ## Unit Tests - the full compiler matrix, gated behind the fast checks above all passing
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: [precommit, sanitizer-tests]
    uses: ./.github/workflows/linux.yml

  macos-tests:
    name: MacOS
    needs: [precommit, sanitizer-tests]
    uses: ./.github/workflows/macos.yml
