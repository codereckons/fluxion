name: FLUXION Linux Tests
on:
  workflow_call:

jobs:
  linux:
    name: ${{ matrix.compiler.name }} (${{ matrix.options }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:${{ matrix.compiler.image }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "gcc"          , preset: "gcc"             , image: "v10" }
          - { name: "clang"        , preset: "clang"           , image: "v10" }

        options: [Debug, Release]

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: ${{ matrix.options }}
          preset: ${{ matrix.compiler.preset }}
          setup-script: ${{ matrix.compiler.setup }}

      - name: Run Unit Tests
        uses: jfalcou/copacabana/.github/actions/test@468da45ac73a026a4bca4510840ebe635aa66c2c # v6
        with:
          config: ${{ matrix.options }}
          preset: ${{ matrix.compiler.preset }}
