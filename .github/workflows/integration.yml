name: FLUXION Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: fluxion-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@main
    with:
      project: fluxion
      cxx-compiler: clang++
      cxx-flags: -std=c++20
