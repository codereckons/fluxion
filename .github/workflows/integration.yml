name: FLUXION Integration Tests
on:
  push:
    branches:
      - main
      ## Temporary, while this branch is not yet main.
      - infra/phoenix

concurrency:
  group: fluxion-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: fluxion
      cxx-compiler: clang++
      cxx-flags: -std=c++20
