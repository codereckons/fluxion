## What every test unit costs to compile: a push to main leaves the reference, a pull request reports the delta.
name: FLUXION Compile Cost
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: fluxion-compile-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-cost:
    ## Reading the reference off another run asks more than the contents scope the token defaults to, and the
    ## reusable workflow holds a job that publishes, whose write GitHub checks even when it does not run.
    permissions:
      actions: read
      contents: write
    uses: jfalcou/copacabana/.github/workflows/compile-cost.yml@main
    with:
      project: fluxion
